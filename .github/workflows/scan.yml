name: swing-scan

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 平日 16:40 JST  通常スキャン (全銘柄・約5分)
    - cron: "20 0 * * 1-5"   # 平日  9:20 JST  ザラ場チェック (候補だけ・約1分)
    - cron: "45 3 * * 1-5"   # 平日 12:45 JST  ザラ場チェック (後場寄り)
  workflow_dispatch:          # Actions 画面から手動で「今すぐ更新」
    inputs:
      mode:
        description: "live = 候補を今の株価で再チェック(1分) / full = 全銘柄スキャン(5分)"
        type: choice
        options: [live, full]
        default: live

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 仮想売買シミュレーター用の株価ファイル (docs/p) を前回の通常スキャンから引き継ぐ
      - name: Restore price files
        uses: actions/cache/restore@v4
        with:
          path: docs/p
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_SCHEDULE" = "40 7 * * 1-5" ] || [ "$INPUT_MODE" = "full" ]; then
            python scan.py
          else
            python scan.py --live
          fi

      - name: Save price files
        if: github.event.schedule == '40 7 * * 1-5' || inputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: docs/p
          key: prices-${{ github.run_id }}

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history universe.csv
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
